<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دليلك الحكومي | Dalilak</title>
    <meta name="description" content="دليل الخدمات الحكومية المصرية: المستندات المطلوبة والخطوات والرسوم ومكان التقديم." />
    <meta name="theme-color" content="#1d4f91" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      // Set theme + language before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('dalilak.theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          var m = location.pathname.match(/\/(ar|en)(\/|$)/);
          var l = (m && m[1]) || localStorage.getItem('dalilak.lang') || 'ar';
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
